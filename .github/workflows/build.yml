# Integração contínua do Sintonia Teleprompter.
#
# - qualidade: formatação, lint (clippy) e testes de todos os crates;
# - build: executáveis de Windows, Linux e macOS (universal);
# - em toda tag "vX.Y.Z", publica os pacotes numa Release do GitHub.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  qualidade:
    name: Formatação, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Bibliotecas do Linux
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Formatação
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Testes
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.nome }}
    needs: qualidade
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Windows
            os: windows-latest
          - nome: Linux
            os: ubuntu-latest
          - nome: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Bibliotecas do Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      - name: Pacote Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/sintonia-teleprompter.exe "dist/Sintonia Teleprompter.exe"
          Compress-Archive -Path "dist/Sintonia Teleprompter.exe" -DestinationPath sintonia-teleprompter-windows-x64.zip

      - name: Pacote Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/sintonia-teleprompter
          cp target/release/sintonia-teleprompter crates/teleprompter/assets/sintonia-icone.png packaging/linux/* dist/sintonia-teleprompter/
          tar -C dist -czf sintonia-teleprompter-linux-x64.tar.gz sintonia-teleprompter

      - name: Build + pacote macOS (universal: Intel e Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output sintonia-teleprompter \
            target/aarch64-apple-darwin/release/sintonia-teleprompter \
            target/x86_64-apple-darwin/release/sintonia-teleprompter
          ./packaging/macos/criar-app.sh sintonia-teleprompter
          ditto -c -k --keepParent "Sintonia Teleprompter.app" sintonia-teleprompter-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sintonia-teleprompter-${{ runner.os }}
          path: |
            sintonia-teleprompter-*.zip
            sintonia-teleprompter-*.tar.gz

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sintonia-teleprompter-*.zip
            sintonia-teleprompter-*.tar.gz
