[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/teleprompter"]

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
chrono = "0.4.45"
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["glow"] }
egui = "0.37.0"
winit = { version = "0.30", default-features = false }
fontdb = "0.24.0"
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["json", "cookies", "blocking"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Dependências otimizadas mesmo em modo debug (o desenho fica fluido).
[profile.dev.package."*"]
opt-level = 2
